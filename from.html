<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="show"></div>
    <form action="" name="myform">
        <input type="text" name="fname" placeholder="enter first name"> <br>
        <input type="text "name="lname" placeholder="enter last name"> <br>
       <input type="button" onclick="fullname()" name="submit" value="submit">
    </form>

    <script> 
    // value satting
    document.myform.fname.value ="first"
    document.myform.lname.value="second" 
        function fullname(){
            let fname = document.myform.fname.value;
            let lname = document.myform.lname.value;
            let full = fname+""+ lname;
            document.getElementById ("show"). innerHTML = full;
            // alert(full);
        }
    </script>
</body>
</html>

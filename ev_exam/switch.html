<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num = Number(prompt("Enter a number"))
        switch(true){
            case num >=80 :
                document.write("A+");
                break;
            case num >=60 :
                document.write("b+");
                break;
            default : 
            alert("fail");''        
        }
    </script>
</body>
</html>

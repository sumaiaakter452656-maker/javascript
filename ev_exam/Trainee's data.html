<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Question:Trainee_Enty</h1>
    <form action="" name="traineeForm" >
        <label for="name">name:</label><br>
        <input type="text" name="name"><br><br>

        <label for="contact">contact:</label><br>
        <input type="text" name="contact"><br><br>
        
        <label for="remarks">remarks:</label><br>
        <textarea name="remarks"></textarea><br><br>

        <label for="gender">gender:</label><br>
        <input type="radio" name="gender" value="male"> Male<br>
        <input type="radio" name="gender" value="female"> Female<br><br>

        <label for="course" >course:</label><br>
        <input type="checkbox" class="course" value="NT">NT
        <input type="checkbox" class="course" value="IAD">IAD
        <input type="checkbox" class="course" value="DDD">DDD
        <br><br>
        
        <label for="">location:</label><br>
        <select name="location" >
            <option >Bonani</option>
            <option >Dhanmondi</option>
            <option >Mirpur</option>
        </select><br><br>
        <input type="button" onclick="getvalues()" name="submit" value="submit">

        
        
        <script>
        function getvalues(){
            //alert("hello")
            let name = document.traineeForm.name.value;
            let contect = document.traineeForm.contact.value;
            let remarks = document.traineeForm.remarks.value;
            let gender = document.traineeForm.gender.value;
            //let course = document.traineeForm.course.value;
            let location = document.traineeForm.location.value;
            let output = "";
            output +="name:"+name+"<br>";
            output +="contact :"+contact+"<br>";
            output +="remarks :"+remarks+"<br>";
            output +="gender :"+gender+"<br>";
            output += "location:" +location+"<br>";
            let courseOutput="";
            const course =document.getElementsByClassName(course);
            for(let i=0 ; i<course.length;i++){
                if(course[i].checked){
                   courseOutput += course[i].value+",";
                }
            }
          
            // let mywindow = window.open("","","height:300px , width: 400px");
            // mywindow.document.write(output);
            
            let mywindow = window.open("", "", "width=400,height=300");
            mywindow.document.write(output);
        }
    </script>
</body>
</html>

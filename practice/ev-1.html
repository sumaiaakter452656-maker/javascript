<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" name="myform">
        <input type="text" name="name" placeholder="Enter your name"><br><br>
        <input type="text" name="contact" placeholder="Enter your number"> <br><br>
        <textarea name="remarks" placeholder="Enter the remarks"></textarea><br>
        <br>Gender: <br>
        <input type="radio" name="gender" value="male"> Male<br>
        <input type="radio" name="gender" value="female"> Female<br>
        <br>Course: <br>
         <input type="checkbox" class="course" value="NT">NT
        <input type="checkbox" class="course" value="IAD">IAD
        <input type="checkbox" class="course" value="DDD">DDD <br>
        <br>location: <br>
        <select name="district" >
            <option >select one</option>
            <option>Dhaka</option>
            <option >cumilla</option>
            <option >pabna</option>           
        </select> <br> <br>
        <input type="button" onclick="mywindow()" name="submit" value="open"><br> <br>
        <input type="button" onclick="mywindow.close()" name="submit" value="close"><br>
    </form>
    <div id="show"></div>
    <script>
        function mywindow(){
            let name =document.myform.name.value
            let contact =document.myform.contact.value
            let remarks=document.myform.remarks.value
            let gender =document.myform.gender.value
            let course =document.getElementsByClassName("course");
            let courseOutput ="";
            let district =document.myform.district.value
            
            for(let i=0;i<course.length;i++){
                 if(course[i].checked){
                     courseOutput += course[i].value +","; 
                 }
               }     
            let output = "<div class ='blue'>"
                   
            output +="name:"+name+"<br>"
            output +="contact :"+contact+"<br>"
            output +="remarks :"+remarks+"<br>"
            output +="gender :"+gender+"<br>"
            output +="location: "+district+"<br>"
            output += "course:" +courseOutput +"<br>"
            output +="</div>"

             mywindow= window.open("","","height:300,width:400");
            mywindow.document.write(output);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function tast_prime(n){
            if(n===1){
                return n+ "not a prime number";
            }else if(n===2){
                return n +"is a prime number";
            }else{
                for(let x=2 ;x<n ;x++ ){
                    if(n % x === 0){
                        return n +"not a prime number";
                    }
                }
                return n +"is a prime number";
            }
        }
        document.write(tast_prime(6))


       
    </script>
</body>
</html>

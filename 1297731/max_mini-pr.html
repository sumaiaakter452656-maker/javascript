<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = prompt("Enter a num1")
        let num2 = prompt("Enter a num2")
        let num3 = prompt("Enter a num3")

        let max = num1
        let mini = num2

        if(num2>max){
            max =num2
        }if(num3 > max){
            max=num3
        }if(num2<mini){
            mini =num2
        }if(num3<mini){
            mini=num3
        }
        document.write("max:"+max)
        document.write("mini:"+mini)
    </script>
</body>
</html>

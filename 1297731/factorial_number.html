<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
       let mynum = prompt("enter a number","");

       let output = 1;

       for(let i=1; i<=mynum; i++){
        output *= i;
       }
      document.write("the factorial of " + mynum + " is " + output);
    </script>
</body>
</html>

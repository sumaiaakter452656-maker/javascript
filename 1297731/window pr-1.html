<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="" name:myform>
        <input type="text" name="name" placeholder="enter your name"> <br><br>
        <input type="text" name="contact" placeholder="enter your number"> <br>
        <br> Remarks: <br>
        <textarea name="remarks" ></textarea>

        <input type="radio" name="gender" value="male">Male <br>
        <input type="radio" name="gender" value="female">female <br>
        <br> course : <br>

        <input type="checkbox" class="course" value="DDD">DDD
        <input type="checkbox" class="course" value="ESAW">ESAW <br>
        <br> location: <br>
        <select name="city" >
            <option >select one</option>
            <option >dhaka</option>
            <option >chandpur</option>
            <option >cumilla</option> <br>
        </select>
        <input type="button" onclick="mywindow()" name="submit" value="open">
    </form>
</body>
</html>

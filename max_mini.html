<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let num1 = prompt("Enter the first number");
        let num2 = prompt("Enter the second number");
        let num3 = prompt("Enter the third number");
     
        if(num1 > num2 && num1 > num3 ){
            document.write("The maximum number is: " + num1);
        } else if(num2 > num1 && num2 > num3){
            document.write("The maximum number is: " + num2);
        } else if (num3 < num1 && num3 < num2){
            document.write("The minimum number is: " + num3);
        } else if (num2 < num1 && num2 < num3){
            document.write("The minimum number is: " + num2);
        } else if (num1 < num2 && num1 < num3){
            document.write("The minimum number is: " + num1);
        }
         else {
            document.write("The maximum number is: " + num3);
        }
    </script>
</body>
</html>
